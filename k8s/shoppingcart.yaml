apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoppingcart
  labels:
    app.kubernetes.io/name: shoppingcart
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shoppingcart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shoppingcart
    spec:
      initContainers:
        - name: wait-for-database
          image: postgres:18
          command:
            - sh
            - -c
            - until pg_isready -h shoppingcart-db -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do echo "Waiting for PostgreSQL"; sleep 2; done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: shoppingcart-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: shoppingcart-secrets
                  key: POSTGRES_DB
      containers:
        - name: shoppingcart
          image: shoppingcart:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:5000
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: shoppingcart-secrets
                  key: DefaultConnection
            - name: TokenKey
              valueFrom:
                secretKeyRef:
                  name: shoppingcart-secrets
                  key: TokenKey
            - name: AdminPassword
              valueFrom:
                secretKeyRef:
                  name: shoppingcart-secrets
                  key: AdminPassword
            - name: CloudinarySettings__CloudName
              valueFrom:
                secretKeyRef:
                  name: shoppingcart-secrets
                  key: CLOUDINARY_CLOUD_NAME
                  optional: true
            - name: CloudinarySettings__ApiKey
              valueFrom:
                secretKeyRef:
                  name: shoppingcart-secrets
                  key: CLOUDINARY_API_KEY
                  optional: true
            - name: CloudinarySettings__ApiSecret
              valueFrom:
                secretKeyRef:
                  name: shoppingcart-secrets
                  key: CLOUDINARY_API_SECRET
                  optional: true
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi

---

apiVersion: v1
kind: Service
metadata:
  name: shoppingcart
  labels:
    app.kubernetes.io/name: shoppingcart
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: shoppingcart
  ports:
    - name: http
      port: 5000
      targetPort: http
