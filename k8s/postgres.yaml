apiVersion: v1
kind: Service
metadata:
  name: shoppingcart-db
  labels:
    app.kubernetes.io/name: shoppingcart-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: shoppingcart-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shoppingcart-db
spec:
  serviceName: shoppingcart-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shoppingcart-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shoppingcart-db
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: shoppingcart-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shoppingcart-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: shoppingcart-secrets
                  key: POSTGRES_DB
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
